<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Activity</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    {% include "_navbar.html" %}

    <main class="container form-container" id="main-content">

        <h1>Edit Activity</h1>

        <section class="card">

            <form method="POST">

                <label for="category">Category:</label>

<select
    id="category"
    name="category"
    required
>
    {% for category in categories %}

        <option
            value="{{ category.name }}"
            {% if category.name == record.category %}
                selected
            {% endif %}
        >
            {{ category.name }}
        </option>

    {% endfor %}

</select>

                <label for="subject">
                    Activity details:
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    value="{{ record.subject }}"
                    maxlength="100"
                    required
                >

                <label for="minutes">
                    Duration (minutes):
                </label>

                <input
                    type="number"
                    id="minutes"
                    name="minutes"
                    value="{{ record.minutes }}"
                    min="1"
                    required
                >

                <label for="study_date">Date:</label>

                <input
                    type="date"
                    id="study_date"
                    name="study_date"
                    value="{{ record.study_date }}"
                    required
                >

                <button type="submit">
                    Update Activity
                </button>

                <a href="{{ url_for('home') }}">
                    Cancel
                </a>

            </form>

        </section>

    </main>

</body>

</html>
